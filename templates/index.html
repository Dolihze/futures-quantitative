<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货量化交易系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
        }

        /* 顶部导航栏 */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 24px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo svg {
            width: 18px;
            height: 18px;
        }

        .nav-title {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: 1px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        .logout-btn {
            padding: 6px 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            color: #f87171;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* 主内容区 */
        .main-content {
            padding: 32px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .welcome-section {
            margin-bottom: 32px;
        }

        .welcome-section h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .welcome-section p {
            font-size: 14px;
            color: #64748b;
        }

        /* 数据统计 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .stat-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .stat-value.positive { color: #ef4444; }  /* 盈利 - 红色 */
        .stat-value.negative { color: #22c55e; }  /* 亏损 - 绿色 */
        .stat-value.zero { color: #f1f5f9; }  /* 0 - 白色 */

        .stat-change {
            font-size: 12px;
            margin-top: 4px;
            color: #64748b;
        }

        /* 下单交易模块 */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 16px;
        }

        /* 量化账号连接状态 */
        .quant-account-status {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-text {
            font-size: 13px;
            color: #94a3b8;
        }

        .status-text.connected {
            color: #22c55e;
        }

        .connect-btn {
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            color: #3b82f6;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .connect-btn:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .connect-btn.connected {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.3);
            color: #22c55e;
            cursor: default;
        }

        .connect-btn svg {
            width: 14px;
            height: 14px;
        }

        /* 交易面板禁用状态 */
        .trading-panel.disabled {
            opacity: 0.5;
            pointer-events: none;
            position: relative;
        }

        .trading-panel.disabled::after {
            content: '请先连接量化账号';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 24px;
            border-radius: 8px;
            color: #f87171;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.3);
            z-index: 10;
        }

        .trading-panel {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            padding: 24px;
        }

        .trading-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: stretch;
        }

        .trading-row:last-child {
            margin-bottom: 0;
        }

        /* 输入框组件 */
        .input-group {
            flex: 1;
            position: relative;
        }

        .input-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 8px;
            transition: all 0.2s;
            height: 48px;
        }

        .input-wrapper:focus-within {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(15, 23, 42, 0.8);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 16px;
            font-weight: 600;
            padding: 0 12px;
            height: 100%;
        }

        .input-wrapper input::-webkit-inner-spin-button,
        .input-wrapper input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        .input-btn-group {
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(71, 85, 105, 0.3);
        }

        .input-btn {
            flex: 1;
            width: 32px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .input-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .input-btn:first-child {
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }

        .input-btn svg {
            width: 14px;
            height: 14px;
        }

        /* 价格下拉选择器 */
        .price-type-selector {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            background: rgba(30, 41, 59, 0.98);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 6px;
            display: none;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .price-type-selector.active {
            display: block;
        }

        .price-type-option {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: #cbd5e1;
        }

        .price-type-option:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #f1f5f9;
        }

        .price-type-option.selected {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        /* 交易按钮 */
        .trading-btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trading-btn.long {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .trading-btn.long:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
        }

        .trading-btn.short {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .trading-btn.short:hover {
            background: rgba(34, 197, 94, 0.25);
            border-color: rgba(34, 197, 94, 0.5);
        }

        .trading-btn.close {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        .trading-btn.close:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .trading-btn.reverse {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #8b5cf6;
        }

        .trading-btn.reverse:hover {
            background: rgba(139, 92, 246, 0.25);
            border-color: rgba(139, 92, 246, 0.5);
        }

        /* 快捷下单按钮 */
        .quick-order-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }

        .quick-order-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .quick-order-btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }

        .quick-order-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 自定义弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 32px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.3s ease;
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-icon svg {
            width: 28px;
            height: 28px;
            color: #3b82f6;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .modal-message {
            font-size: 14px;
            color: #94a3b8;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 20h18M3 20l4-8 4 4 4-10 4 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>
            <span class="nav-title">期货量化交易系统</span>
        </div>
        <div class="nav-right">
            <div class="user-info">
                <div class="user-avatar">{{ username[0]|upper if username else 'U' }}</div>
                <span>{{ username or '未登录' }}</span>
            </div>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="main-content">

        <div class="welcome-section">
            <h1>欢迎回来，{{ username or '交易员' }}</h1>
            <p>今日市场概览 · 祝您交易顺利</p>
        </div>

        <!-- 数据统计 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">账户权益</div>
                <div class="stat-value">¥ 0.00</div>
                <div class="stat-change">暂无数据</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">可用资金</div>
                <div class="stat-value">¥ 0.00</div>
                <div class="stat-change">暂无数据</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">使用率</div>
                <div class="stat-value">0.00%</div>
                <div class="stat-change">暂无数据</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">今日盈亏</div>
                <div class="stat-value zero">¥ 0.00</div>
                <div class="stat-change">暂无数据</div>
            </div>
        </div>

        <!-- 下单交易模块 -->
        <h2 class="section-title">下单交易</h2>
        
        <!-- 量化账号连接状态 -->
        <div class="quant-account-status">
            <div class="status-left">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="status-text" id="statusText">未连接量化账号</span>
            </div>
            <button class="connect-btn" id="connectBtn" onclick="connectQuantAccount()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                <span id="connectBtnText">连接账号</span>
            </button>
        </div>

        <!-- 下单交易面板 -->
        <div class="trading-panel disabled" id="tradingPanel">
            <!-- 第一行：价格和手数 -->
            <div class="trading-row">
                <!-- 价格输入 -->
                <div class="input-group">
                    <div class="input-label">价格</div>
                    <div class="input-wrapper" id="priceWrapper">
                        <input type="text" id="priceInput" value="市价" readonly>
                        <div class="input-btn-group">
                            <button class="input-btn" onclick="adjustPrice(1)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="18 15 12 9 6 15"/>
                                </svg>
                            </button>
                            <button class="input-btn" onclick="adjustPrice(-1)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- 价格类型下拉选择器 -->
                    <div class="price-type-selector" id="priceTypeSelector">
                        <div class="price-type-option selected" data-type="latest" data-value="最新价">最新价</div>
                        <div class="price-type-option" data-type="opponent" data-value="对手价">对手价</div>
                        <div class="price-type-option" data-type="overprice" data-value="超价">超价</div>
                        <div class="price-type-option" data-type="market" data-value="市价">市价</div>
                    </div>
                </div>

                <!-- 手数输入 -->
                <div class="input-group">
                    <div class="input-label">手数</div>
                    <div class="input-wrapper">
                        <input type="number" id="volumeInput" value="1" min="1">
                        <div class="input-btn-group">
                            <button class="input-btn" onclick="adjustVolume(1)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="18 15 12 9 6 15"/>
                                </svg>
                            </button>
                            <button class="input-btn" onclick="adjustVolume(-1)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 第二行：交易操作 -->
            <div class="trading-row">
                <button class="trading-btn long" onclick="executeTrade('long')">
                    买多
                </button>
                <button class="trading-btn short" onclick="executeTrade('short')">
                    卖空
                </button>
                <button class="trading-btn close" onclick="executeTrade('close')">
                    平仓
                </button>
                <button class="trading-btn reverse" onclick="executeTrade('reverse')">
                    反手
                </button>
            </div>

            <!-- 第三行：快捷下单 -->
            <div class="quick-order-section">
                <button class="quick-order-btn" onclick="quickOrder()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    一键快捷下单
                </button>
            </div>
        </div>
    </div>

    <!-- 自定义弹窗 -->
    <div class="modal-overlay" id="comingSoonModal">
        <div class="modal-content">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            </div>
            <div class="modal-title">敬请期待</div>
            <div class="modal-message">功能正在开发中，敬请期待</div>
        </div>
    </div>

    <script>
        // 量化账号连接状态管理
        let isQuantConnected = false;

        // 连接量化账号 - 后台自动登录
        function connectQuantAccount() {
            if (isQuantConnected) {
                // 已连接，断开连接
                disconnectQuantAccount();
                return;
            }

            // 直接调用后台 API 进行登录
            const connectBtn = document.getElementById('connectBtn');
            const connectBtnText = document.getElementById('connectBtnText');
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const tradingPanel = document.getElementById('tradingPanel');

            // 更新 UI 状态为连接中
            connectBtnText.textContent = '连接中...';
            connectBtn.disabled = true;

            // 调用后台登录 API
            fetch('/api/quant-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    // 登录成功
                    isQuantConnected = true;
                    
                    // 更新状态指示器
                    statusIndicator.classList.add('connected');
                    
                    // 更新状态文本
                    statusText.textContent = '量化账号已连接';
                    statusText.classList.add('connected');
                    
                    // 更新按钮状态
                    connectBtn.classList.add('connected');
                    connectBtn.disabled = false;
                    connectBtnText.textContent = '连接成功';
                    
                    // 启用交易面板
                    tradingPanel.classList.remove('disabled');
                } else {
                    // 登录失败
                    alert(result.message || '登录失败');
                    connectBtn.disabled = false;
                    connectBtnText.textContent = '连接账号';
                }
            })
            .catch(error => {
                console.error('登录错误:', error);
                alert('登录失败，请稍后重试');
                connectBtn.disabled = false;
                connectBtnText.textContent = '连接账号';
            });
        }

        // 断开量化账号连接
        function disconnectQuantAccount() {
            const connectBtn = document.getElementById('connectBtn');
            const connectBtnText = document.getElementById('connectBtnText');
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const tradingPanel = document.getElementById('tradingPanel');

            // 更新状态
            isQuantConnected = false;
            
            // 更新状态指示器
            statusIndicator.classList.remove('connected');
            
            // 更新状态文本
            statusText.textContent = '未连接量化账号';
            statusText.classList.remove('connected');
            
            // 更新按钮状态
            connectBtn.classList.remove('connected');
            connectBtnText.textContent = '连接账号';
            
            // 禁用交易面板
            tradingPanel.classList.add('disabled');
            
            // 这里可以添加实际的断开逻辑
            // disconnectQuantWebSocket();
        }

        // 价格输入框点击事件
        const priceWrapper = document.getElementById('priceWrapper');
        const priceInput = document.getElementById('priceInput');
        const priceTypeSelector = document.getElementById('priceTypeSelector');
        const priceTypeOptions = document.querySelectorAll('.price-type-option');

        // 点击价格框切换显示/隐藏下拉选择器
        priceWrapper.addEventListener('click', function(e) {
            if (e.target.closest('.input-btn')) {
                return; // 如果点击的是加减按钮，不触发下拉框
            }
            priceTypeSelector.classList.toggle('active');
        });

        // 选择价格类型
        priceTypeOptions.forEach(option => {
            option.addEventListener('click', function() {
                const value = this.getAttribute('data-value');
                priceInput.value = value;
                
                // 更新选中状态
                priceTypeOptions.forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                
                // 如果是市价，设置为只读
                if (value === '市价') {
                    priceInput.readOnly = true;
                } else {
                    priceInput.readOnly = false;
                    priceInput.value = ''; // 清空让用户输入
                    priceInput.placeholder = value;
                }
                
                priceTypeSelector.classList.remove('active');
            });
        });

        // 点击外部关闭下拉选择器
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#priceWrapper') && !e.target.closest('#priceTypeSelector')) {
                priceTypeSelector.classList.remove('active');
            }
        });

        // 调整价格
        function adjustPrice(direction) {
            const currentPrice = parseFloat(priceInput.value);
            if (isNaN(currentPrice)) return;
            
            const tickSize = 1; // 最小变动价位，可根据品种调整
            const newPrice = currentPrice + (direction * tickSize);
            
            if (newPrice > 0) {
                priceInput.value = newPrice.toFixed(2);
            }
        }

        // 调整手数
        function adjustVolume(direction) {
            const volumeInput = document.getElementById('volumeInput');
            const currentValue = parseInt(volumeInput.value);
            const newValue = currentValue + direction;
            
            if (newValue >= 1) {
                volumeInput.value = newValue;
            }
        }

        // 执行交易
        function executeTrade(type) {
            const price = document.getElementById('priceInput').value;
            const volume = document.getElementById('volumeInput').value;
            
            const tradeTypes = {
                'long': '买多',
                'short': '卖空',
                'close': '平仓',
                'reverse': '反手'
            };
            
            alert(`执行交易：${tradeTypes[type]}\n价格：${price}\n手数：${volume}`);
            
            // 这里可以添加实际的下单逻辑
            // 例如：发送请求到后端
        }

        // 快捷下单
        function quickOrder() {
            const price = document.getElementById('priceInput').value;
            const volume = document.getElementById('volumeInput').value;
            
            alert(`快捷下单\n价格：${price}\n手数：${volume}`);
            
            // 这里可以添加实际的快捷下单逻辑
        }

        // 退出登录
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (!confirm('确定要退出登录吗？')) return;
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login';
        });
    </script>
</body>
</html>
