<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化回测 - 期货量化交易系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }

        .header h1 {
            font-size: 24px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .username {
            color: #00d4ff;
            font-size: 14px;
        }

        .logout-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .sidebar {
            width: 300px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #0f3460;
        }

        .control-panel {
            background: #0f3460;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .control-panel h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 13px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: #16213e;
            border: 1px solid #233554;
            border-radius: 5px;
            color: #eee;
            font-size: 14px;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .chart-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #1a1a2e;
        }

        .chart-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chart-title h2 {
            color: #00d4ff;
            font-size: 20px;
        }

        .data-info {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .info-item {
            display: flex;
            gap: 5px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #00d4ff;
            font-weight: bold;
        }

        #klineChart {
            flex: 1;
            background: #16213e;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px 50px;
            border-radius: 10px;
            z-index: 1000;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 5px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message.success {
            background: #22c55e;
            color: white;
        }

        .message.error {
            background: #ef4444;
            color: white;
        }

        .stats-panel {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .stats-panel h4 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            background: #16213e;
            padding: 10px;
            border-radius: 5px;
        }

        .stat-label {
            color: #888;
            font-size: 12px;
        }

        .stat-value {
            color: #00d4ff;
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 量化回测系统</h1>
        <div class="user-info">
            <span class="username">欢迎, {{ username }}</span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="control-panel">
                <h3>⚙️ 回测参数设置</h3>
                <div class="form-group">
                    <label>合约代码</label>
                    <select id="symbol">
                        <option value="FU2611">燃料油FU2611</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>数据周期</label>
                    <select id="period">
                        <option value="1">1分钟</option>
                        <option value="5">5分钟</option>
                        <option value="15">15分钟</option>
                        <option value="30">30分钟</option>
                        <option value="60">60分钟</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>数据范围</label>
                    <select id="dateRange">
                        <option value="7">近7天</option>
                        <option value="30" selected>近30天</option>
                        <option value="60">近60天</option>
                        <option value="90">近90天</option>
                    </select>
                </div>
                <button class="btn" id="loadBtn" onclick="loadKlineData()">
                    📈 加载数据
                </button>
            </div>

            <div class="stats-panel" id="statsPanel" style="display: none;">
                <h4>📊 数据统计</h4>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">数据点数</div>
                        <div class="stat-value" id="dataCount">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最新价格</div>
                        <div class="stat-value" id="latestPrice">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最高价格</div>
                        <div class="stat-value" id="highPrice" style="color: #ef4444;">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最低价格</div>
                        <div class="stat-value" id="lowPrice" style="color: #22c55e;">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">
                <h2 id="chartTitle">燃料油FU2611 - 1分钟K线图</h2>
                <div class="data-info">
                    <div class="info-item">
                        <span class="info-label">合约:</span>
                        <span class="info-value" id="infoSymbol">FU2611</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">周期:</span>
                        <span class="info-value" id="infoPeriod">1分钟</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">更新时间:</span>
                        <span class="info-value" id="updateTime">--</span>
                    </div>
                </div>
            </div>
            <div id="klineChart"></div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div style="text-align: center; color: #00d4ff;">正在加载数据...</div>
    </div>

    <script>
        let chart = null;

        // 初始化图表
        function initChart() {
            const chartDom = document.getElementById('klineChart');
            chart = echarts.init(chartDom);
            
            const option = {
                backgroundColor: '#16213e',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    },
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: '#00d4ff',
                    textStyle: {
                        color: '#fff'
                    },
                    formatter: function (params) {
                        const data = params[0];
                        if (!data) return '';
                        
                        const values = data.data;
                        return `
                            <div style="font-weight: bold; margin-bottom: 5px;">${data.axisValue}</div>
                            <div>开盘: ${values[1]}</div>
                            <div>收盘: ${values[2]}</div>
                            <div>最低: ${values[3]}</div>
                            <div>最高: ${values[4]}</div>
                        `;
                    }
                },
                grid: {
                    left: '10%',
                    right: '5%',
                    top: '5%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: [],
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        color: '#aaa',
                        rotate: 45
                    }
                },
                yAxis: {
                    type: 'value',
                    scale: true,
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        color: '#aaa'
                    },
                    splitLine: {
                        lineStyle: {
                            color: '#2a2a3e'
                        }
                    }
                },
                dataZoom: [
                    {
                        type: 'inside',
                        xAxisIndex: [0],
                        start: 70,
                        end: 100
                    },
                    {
                        show: true,
                        xAxisIndex: [0],
                        type: 'slider',
                        bottom: '5%',
                        height: 20,
                        start: 70,
                        end: 100,
                        borderColor: '#00d4ff',
                        backgroundColor: '#0f3460',
                        dataBackground: {
                            lineStyle: {
                                color: '#00d4ff'
                            },
                            areaStyle: {
                                color: 'rgba(0, 212, 255, 0.2)'
                            }
                        }
                    }
                ],
                series: [
                    {
                        name: 'K线',
                        type: 'candlestick',
                        data: [],
                        itemStyle: {
                            color: '#ef4444',        // 阳线颜色（红色）
                            color0: '#22c55e',       // 阴线颜色（绿色）
                            borderColor: '#ef4444',  // 阳线边框
                            borderColor0: '#22c55e'  // 阴线边框
                        }
                    }
                ]
            };
            
            chart.setOption(option);
            
            // 响应式图表
            window.addEventListener('resize', function() {
                chart.resize();
            });
        }

        // 加载K线数据
        async function loadKlineData() {
            const symbol = document.getElementById('symbol').value;
            const period = document.getElementById('period').value;
            const dateRange = document.getElementById('dateRange').value;
            
            const loadBtn = document.getElementById('loadBtn');
            const loading = document.getElementById('loading');
            
            loadBtn.disabled = true;
            loading.classList.add('show');
            
            try {
                const response = await fetch(`/api/backtest/kline?symbol=${symbol}&period=${period}&days=${dateRange}`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    updateChart(result.data, symbol, period);
                    updateStats(result.data);
                    showMessage('数据加载成功！', 'success');
                } else {
                    showMessage(result.message || '数据加载失败', 'error');
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                showMessage('网络请求失败', 'error');
            } finally {
                loadBtn.disabled = false;
                loading.classList.remove('show');
            }
        }

        // 更新图表
        function updateChart(data, symbol, period) {
            // 准备K线数据
            const categoryData = []; // 时间轴
            const klineData = [];    // K线数据 [开盘, 收盘, 最低, 最高]
            
            data.forEach(item => {
                categoryData.push(item.time);
                klineData.push([item.open, item.close, item.low, item.high]);
            });
            
            // 更新图表标题
            document.getElementById('chartTitle').textContent = `${symbol} - ${period}分钟K线图`;
            document.getElementById('infoSymbol').textContent = symbol;
            document.getElementById('infoPeriod').textContent = period;
            document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
            
            // 更新图表配置
            const option = chart.getOption();
            option.xAxis[0].data = categoryData;
            option.series[0].data = klineData;
            
            chart.setOption(option);
        }

        // 更新统计信息
        function updateStats(data) {
            if (data.length === 0) return;
            
            const latestPrice = data[data.length - 1].close;
            const highPrice = Math.max(...data.map(d => d.high));
            const lowPrice = Math.min(...data.map(d => d.low));
            
            document.getElementById('statsPanel').style.display = 'block';
            document.getElementById('dataCount').textContent = data.length;
            document.getElementById('latestPrice').textContent = latestPrice.toFixed(2);
            document.getElementById('highPrice').textContent = highPrice.toFixed(2);
            document.getElementById('lowPrice').textContent = lowPrice.toFixed(2);
        }

        // 显示消息
        function showMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }

        // 退出登录
        async function logout() {
            try {
                const response = await fetch('/logout', { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('退出失败:', error);
            }
        }

        // 页面加载完成后初始化图表
        window.addEventListener('load', function() {
            initChart();
            // 自动加载一次数据
            loadKlineData();
        });
    </script>
</body>
</html>
