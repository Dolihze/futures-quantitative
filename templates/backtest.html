<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化回测 - 期货量化交易系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }

        .header h1 {
            font-size: 24px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .username {
            color: #00d4ff;
            font-size: 14px;
        }

        .logout-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .sidebar {
            width: 300px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #0f3460;
        }

        .control-panel {
            background: #0f3460;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .control-panel h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 13px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: #16213e;
            border: 1px solid #233554;
            border-radius: 5px;
            color: #eee;
            font-size: 14px;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .chart-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #1a1a2e;
            min-height: 0; /* 确保flex子元素能正确收缩 */
        }

        .chart-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-shrink: 0; /* 标题不被压缩 */
        }

        .chart-title h2 {
            color: #00d4ff;
            font-size: 20px;
        }

        .data-info {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .info-item {
            display: flex;
            gap: 5px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #00d4ff;
            font-weight: bold;
        }

        #klineChart {
            flex: 3; /* 主K线图占据3份空间 */
            background: #16213e;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            min-height: 300px; /* 最小高度保证 */
        }

        #indicatorChart {
            flex: 1; /* 副指标图表占据1份空间 */
            background: #16213e;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
            min-height: 150px; /* 最小高度保证 */
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .loading.hide {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            color: #00d4ff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 5px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message.success {
            background: #22c55e;
            color: white;
        }

        .message.error {
            background: #ef4444;
            color: white;
        }

        /* .stats-panel styles removed */

        .backtest-result {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }

        .backtest-result h4 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-item {
            background: #16213e;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
        }

        .result-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .result-value {
            color: #00d4ff;
            font-size: 18px;
            font-weight: bold;
        }

        .result-value.positive {
            color: #ef4444;
        }

        .result-value.negative {
            color: #22c55e;
        }

        .result-value.neutral {
            color: #ffffff;
        }

        .backtest-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .backtest-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .backtest-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 量化回测系统</h1>
        <div class="user-info">
            <span class="username">欢迎, {{ username }}</span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="control-panel">
                <h3>⚙️ 回测参数设置</h3>
                <div class="form-group">
                    <label>合约代码</label>
                    <select id="symbol">
                        <option value="FU2611">燃料油FU2611</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>数据周期</label>
                    <select id="period">
                        <option value="1">1分钟</option>
                        <option value="5">5分钟</option>
                        <option value="15">15分钟</option>
                        <option value="30">30分钟</option>
                        <option value="60">60分钟</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>数据范围</label>
                    <select id="dateRange">
                        <option value="7">近7天</option>
                        <option value="30" selected>近30天</option>
                        <option value="60">近60天</option>
                        <option value="90">近90天</option>
                    </select>
                </div>
                <button class="btn" id="loadBtn" onclick="loadKlineData()">
                    📈 加载数据
                </button>
            </div>

            <button class="backtest-btn" id="backtestBtn" onclick="runBacktest()">
                🔄 反转信号回测
            </button>

            <div class="backtest-result" id="backtestResult">
                <h4>📊 回测结果</h4>
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">开仓次数</div>
                        <div class="result-value neutral" id="openCount">0</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">胜率</div>
                        <div class="result-value neutral" id="winRate">0%</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">总盈亏</div>
                        <div class="result-value neutral" id="totalProfit">0</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">跨越时间</div>
                        <div class="result-value neutral" id="timeSpan">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">
                <h2 id="chartTitle">燃料油FU2611 - 1分钟K线图</h2>
                <div class="data-info">
                    <div class="info-item">
                        <span class="info-label">合约:</span>
                        <span class="info-value" id="infoSymbol">FU2611</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">周期:</span>
                        <span class="info-value" id="infoPeriod">1分钟</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">更新时间:</span>
                        <span class="info-value" id="updateTime">--</span>
                    </div>
                </div>
            </div>
            
            <div id="klineChart"></div>
            <div id="indicatorChart"></div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">正在加载数据...</div>
    </div>

    <script>
        let chart = null;
        let indicatorChart = null; // 附图指标图表
        
        // 全局变量存储当前加载的数据
        let currentKlineData = null;
        let currentIndicatorData = null;
        let currentSymbol = null;
        
        // 期货品种配置（最小跳动点数和合约乘数）
        const INSTRUMENT_CONFIG = {
            'IF': { tickSize: 0.2, multiplier: 300 },      // 沪深300股指期货
            'IC': { tickSize: 0.2, multiplier: 200 },      // 中证500股指期货
            'IH': { tickSize: 0.2, multiplier: 300 },      // 上证50股指期货
            'AU': { tickSize: 0.02, multiplier: 1000 },    // 黄金
            'AG': { tickSize: 1, multiplier: 15 },         // 白银
            'CU': { tickSize: 10, multiplier: 5 },         // 铜
            'RB': { tickSize: 1, multiplier: 10 },         // 螺纹钢
            'I': { tickSize: 0.5, multiplier: 100 },       // 铁矿石
            'MA': { tickSize: 1, multiplier: 10 },         // 甲醇
            'SA': { tickSize: 1, multiplier: 20 },         // 纯碱
            'FG': { tickSize: 1, multiplier: 20 },         // 玻璃
            'CF': { tickSize: 5, multiplier: 5 },          // 棉花
            'SR': { tickSize: 1, multiplier: 10 },         // 白糖
            'TA': { tickSize: 2, multiplier: 5 },          // PTA
            'M': { tickSize: 1, multiplier: 10 },          // 豆粕
            'Y': { tickSize: 2, multiplier: 10 },          // 豆油
            'P': { tickSize: 2, multiplier: 10 },          // 棕榈油
            'AP': { tickSize: 1, multiplier: 10 },         // 苹果
            'LH': { tickSize: 5, multiplier: 16 },         // 生猪
            'JD': { tickSize: 1, multiplier: 10 },         // 鸡蛋
            'SC': { tickSize: 0.1, multiplier: 1000 },     // 原油
            'FU': { tickSize: 1, multiplier: 10 },         // 燃料油（1跳=10元）
            'RU': { tickSize: 5, multiplier: 10 },         // 橡胶
            'SP': { tickSize: 2, multiplier: 10 }          // 纸浆
        };
        
        // 固定交易手数
        const TRADE_LOTS = 5;
        
        // 获取品种配置
        function getInstrumentConfig(symbol) {
            // 提取品种代码（去掉数字）
            const code = symbol.replace(/\d+/g, '').toUpperCase();
            return INSTRUMENT_CONFIG[code] || { tickSize: 1, multiplier: 10 }; // 默认配置
        }
        
        // 计算每跳价值（元）= 最小跳动 × 合约乘数
        function getTickValue(symbol) {
            const config = getInstrumentConfig(symbol);
            return config.tickSize * config.multiplier;
        }

        // 初始化图表
        function initChart() {
            const chartDom = document.getElementById('klineChart');
            chart = echarts.init(chartDom);
            
            const option = {
                backgroundColor: '#16213e',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    },
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: '#00d4ff',
                    textStyle: {
                        color: '#fff'
                    },
                    formatter: function (params) {
                        if (!params || !params[0]) return '';
                        
                        const param = params[0];
                        // 使用encode映射来确保获取正确的数据
                        // encode: { x: 0, y: [1, 2, 3, 4] } 对应 [开盘, 收盘, 最高, 最低]
                        const seriesData = param.seriesData?.[0] || param.data;
                        
                        if (!seriesData || seriesData.length < 4) {
                            return '';
                        }
                        
                        // ECharts candlestick 数据格式: [开盘价, 收盘价, 最高价, 最低价]
                        const openPrice = seriesData[1];  // encode.y[0] = 开盘价
                        const closePrice = seriesData[2]; // encode.y[1] = 收盘价
                        const highPrice = seriesData[3];  // encode.y[2] = 最高价
                        const lowPrice = seriesData[4];   // encode.y[3] = 最低价
                        
                        return `
                            <div style="font-weight: bold; margin-bottom: 5px;">${param.axisValue}</div>
                            <div>开盘: ${openPrice.toFixed(2)}</div>
                            <div>收盘: ${closePrice.toFixed(2)}</div>
                            <div>最高: ${highPrice.toFixed(2)}</div>
                            <div>最低: ${lowPrice.toFixed(2)}</div>
                        `;
                    }
                },
                grid: {
                    left: '10%',
                    right: '5%',
                    top: '5%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: [],
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        show: false // 隐藏X轴标签
                    },
                    axisTick: {
                        show: false // 隐藏刻度线
                    }
                },
                yAxis: {
                    type: 'value',
                    scale: true,
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        color: '#aaa'
                    },
                    splitLine: {
                        lineStyle: {
                            color: '#2a2a3e'
                        }
                    }
                },
                dataZoom: [
                    {
                        type: 'inside',
                        xAxisIndex: [0],
                        start: 70,
                        end: 100
                    },
                    {
                        show: true,
                        xAxisIndex: [0],
                        type: 'slider',
                        bottom: '5%',
                        height: 20,
                        start: 70,
                        end: 100,
                        borderColor: '#00d4ff',
                        backgroundColor: '#0f3460',
                        dataBackground: {
                            lineStyle: {
                                color: '#00d4ff'
                            },
                            areaStyle: {
                                color: 'rgba(0, 212, 255, 0.2)'
                            }
                        }
                    }
                ],
                series: [
                    {
                        name: 'K线',
                        type: 'candlestick',
                        data: [],
                        itemStyle: {
                            color: '#ef4444',        // 阳线颜色（红色）
                            color0: '#22c55e',       // 阴线颜色（绿色）
                            borderColor: '#ef4444',  // 阳线边框
                            borderColor0: '#22c55e'  // 阴线边框
                        },
                        // 明确指定数据维度映射
                        encode: {
                            x: 0,
                            y: [1, 2, 3, 4]  // [开盘, 收盘, 最高, 最低]
                        }
                    }
                ]
            };
            
            chart.setOption(option);
            
            // 初始化附图指标图表
            initIndicatorChart();
            
            // 实现主副图表dataZoom联动
            chart.on('dataZoom', function(params) {
                const option = chart.getOption();
                const start = option.dataZoom[0].start;
                const end = option.dataZoom[0].end;
                
                // 同步副指标图表的缩放
                const indicatorOption = indicatorChart.getOption();
                indicatorOption.dataZoom[0].start = start;
                indicatorOption.dataZoom[0].end = end;
                if (indicatorOption.dataZoom[1]) {
                    indicatorOption.dataZoom[1].start = start;
                    indicatorOption.dataZoom[1].end = end;
                }
                indicatorChart.setOption(indicatorOption);
            });
            
            indicatorChart.on('dataZoom', function(params) {
                const option = indicatorChart.getOption();
                const start = option.dataZoom[0].start;
                const end = option.dataZoom[0].end;
                
                // 同步主K线图表的缩放
                const mainOption = chart.getOption();
                mainOption.dataZoom[0].start = start;
                mainOption.dataZoom[0].end = end;
                chart.setOption(mainOption);
            });
            
            // 响应图表
            window.addEventListener('resize', function() {
                chart.resize();
                indicatorChart.resize();
            });
        }

        // 初始化附图指标图表
        function initIndicatorChart() {
            const indicatorDom = document.getElementById('indicatorChart');
            indicatorChart = echarts.init(indicatorDom);
            
            const option = {
                backgroundColor: '#16213e',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: '#00d4ff',
                    textStyle: {
                        color: '#fff'
                    }
                },
                grid: {
                    left: '10%',
                    right: '5%',
                    top: '10%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: [],
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        show: false // 隐藏X轴标签
                    },
                    axisTick: {
                        show: false // 隐藏刻度线
                    }
                },
                yAxis: {
                    type: 'value',
                    scale: true,
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        color: '#aaa'
                    },
                    splitLine: {
                        lineStyle: {
                            color: '#2a2a3e'
                        }
                    }
                },
                dataZoom: [
                    {
                        type: 'inside',
                        xAxisIndex: [0],
                        start: 70,
                        end: 100
                    }
                ],
                series: [
                    {
                        name: 'VAR9',
                        type: 'bar',
                        data: [],
                        itemStyle: {
                            color: '#22c55e' // 绿色
                        }
                    },
                    {
                        name: 'VAR9L',
                        type: 'bar',
                        data: [],
                        itemStyle: {
                            color: '#ef4444' // 红色
                        }
                    }
                ]
            };
            
            indicatorChart.setOption(option);
        }

        // 加载K线数据
        async function loadKlineData() {
            const symbol = document.getElementById('symbol').value;
            const period = document.getElementById('period').value;
            const dateRange = document.getElementById('dateRange').value;
            
            const loadBtn = document.getElementById('loadBtn');
            const loading = document.getElementById('loading');
            
            loadBtn.disabled = true;
            // 显示遮罩层
            loading.style.display = 'flex';
            loading.classList.remove('hide');
            
            try {
                const url = `/api/backtest/kline?symbol=${symbol}&period=${period}&days=${dateRange}`;
                
                const response = await fetch(url);
                
                // 检查HTTP状态码
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const result = await response.json();
                
                if (result.success && result.data) {
                    updateChart(result.data, symbol, period);
                    showMessage(`数据加载成功！共 ${result.count || result.data.length} 条数据`, 'success');
                } else {
                    showMessage(result.message || '数据加载失败', 'error');
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                const errorMsg = error.message || '网络请求失败';
                showMessage(`加载失败: ${errorMsg}`, 'error');
            } finally {
                loadBtn.disabled = false;
                // 隐藏遮罩层
                loading.classList.add('hide');
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 300);
            }
        }

        // 同花顺指标计算辅助函数
        // SMA函数：同花顺标准递归加权移动平均 SMA(X,N,M)
        function SMA(data, period, weight) {
            const result = [];
            const M = weight ?? 1;
            const N = period;
            let prevSma = null;

            for (let i = 0; i < data.length; i++) {
                const val = data[i];
                // 如果是空值，直接填充NaN，不继续计算
                if (isNaN(val) || val === null || val === undefined) {
                    result.push(NaN);
                    prevSma = null;
                    continue;
                }
                if (prevSma === null) {
                    prevSma = val;
                } else {
                    prevSma = (M * val + (N - M) * prevSma) / N;
                }
                result.push(prevSma);
            }
            return result;
        }

        // EMA函数：指数移动平均
        function EMA(data, period) {
            const result = [];
            const multiplier = 2 / (period + 1);
            
            for (let i = 0; i < data.length; i++) {
                if (i === 0) {
                    result.push(data[0]);
                } else {
                    result.push((data[i] - result[i - 1]) * multiplier + result[i - 1]);
                }
            }
            return result;
        }

        // REF函数：引用前N个数据
        function REF(data, n) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < n) {
                    result.push(data[i]);
                } else {
                    result.push(data[i - n]);
                }
            }
            return result;
        }

        // HHV函数：取N个周期内的最高值
        function HHV(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(data[i]);
                } else {
                    let max = data[i];
                    for (let j = 1; j < period; j++) {
                        max = Math.max(max, data[i - j]);
                    }
                    result.push(max);
                }
            }
            return result;
        }

        // LLV函数：取N个周期内的最低值
        function LLV(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(data[i]);
                } else {
                    let min = data[i];
                    for (let j = 1; j < period; j++) {
                        min = Math.min(min, data[i - j]);
                    }
                    result.push(min);
                }
            }
            return result;
        }

        // ABS函数：取绝对值
        function ABS(data) {
            return data.map(v => Math.abs(v));
        }

        // MAX函数：取两个数组的最大值
        function MAX(data1, data2) {
            return data1.map((v, i) => Math.max(v, data2[i] || 0));
        }

        // MA函数：简单移动平均
        function MA(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(data[i]);
                } else {
                    let sum = 0;
                    for (let j = 0; j < period; j++) {
                        sum += data[i - j];
                    }
                    result.push(sum / period);
                }
            }
            return result;
        }

        // IF函数：条件判断
        function IF(condition, trueValue, falseValue) {
            return condition.map((c, i) => c ? trueValue[i] : falseValue[i]);
        }

        // 计算同花顺指标
        function calculateIndicator(data) {
            const high = data.map(d => d.high);
            const low = data.map(d => d.low);
            const close = data.map(d => d.close);
            
            // 计算 VAR2 到 VAR9
            const VAR2 = REF(high, 1);
            const VAR3_temp1 = SMA(ABS(high.map((h, i) => h - VAR2[i])), 3, 1);
            const VAR3_temp2 = SMA(MAX(VAR2.map((v, i) => v - high[i]), 0), 3, 1);
            const VAR3 = VAR3_temp1.map((v, i) => VAR3_temp2[i] !== 0 ? (v / VAR3_temp2[i]) * 100 : 0);
            
            // 修正理解：IF(CLOSE*0.7, ...) 实际含义可能是 IF(CLOSE/REF(CLOSE,1) < 0.7, ...)
            // 即价格下跌超过30%时放大信号，否则缩小信号
            const closeRef = REF(close, 1);
            const VAR4_base = close.map((c, i) => {
                const ratio = i > 0 ? c / closeRef[i] : 1;
                return ratio < 0.7 ? VAR3[i] * 10 : VAR3[i] / 10;
            });
            const VAR4 = EMA(VAR4_base, 3);
            
            const VAR5 = HHV(high, 50);
            const VAR6 = LLV(VAR4, 50);
            const ma58 = MA(close, 58);
            const VAR7 = ma58.map(v => v > 0 ? 1 : 0);
            
            const VAR8_base = high.map((h, i) => {
                if (h >= VAR5[i]) {
                    return (VAR4[i] + VAR6[i] * 2) / 2;
                }
                return 0;
            });
            const VAR8 = EMA(VAR8_base, 3).map((v, i) => v / 1000 * VAR7[i]);
            const VAR9 = VAR8.map(v => v > 100 ? 100 : v);
            
            // 计算 VAR2L 到 VAR9L
            const VAR2L = REF(low, 1);
            const VAR3L_temp1 = SMA(ABS(low.map((l, i) => l - VAR2L[i])), 3, 1);
            const VAR3L_temp2 = SMA(MAX(low.map((l, i) => l - VAR2L[i]), 0), 3, 1);
            const VAR3L = VAR3L_temp1.map((v, i) => VAR3L_temp2[i] !== 0 ? (v / VAR3L_temp2[i]) * 100 : 0);
            
            // 修正理解：IF(CLOSE*1.3, ...) 实际含义可能是 IF(CLOSE/REF(CLOSE,1) > 1.3, ...)
            // 即价格上涨超过30%时放大信号，否则缩小信号
            const VAR4L_base = close.map((c, i) => {
                const ratio = i > 0 ? c / closeRef[i] : 1;
                return ratio > 1.3 ? VAR3L[i] * 10 : VAR3L[i] / 10;
            });
            const VAR4L = EMA(VAR4L_base, 3);
            
            const VAR5L = LLV(low, 50);
            const VAR6L = HHV(VAR4L, 50);
            const ma58L = MA(close, 58);
            const VAR7L = ma58L.map(v => v > 0 ? 1 : 0);
            
            const VAR8L_base = low.map((l, i) => {
                if (l <= VAR5L[i]) {
                    return (VAR4L[i] + VAR6L[i] * 2) / 2;
                }
                return 0;
            });
            const VAR8L = EMA(VAR8L_base, 3).map((v, i) => v / 1000 * VAR7L[i]);
            const VAR9L = VAR8L.map(v => v > 100 ? 100 : v);
            
            return {
                VAR9: VAR9,
                VAR9L: VAR9L
            };
        }

        // 更新图表
        function updateChart(data, symbol, period) {
            // 保存数据到全局变量
            currentKlineData = data;
            currentSymbol = symbol;
            
            // 准备K线数据
            const categoryData = []; // 时间轴
            const klineData = [];    // K线数据
            
            data.forEach(item => {
                categoryData.push(item.time);
                // ECharts candlestick 数据格式: [开盘价, 收盘价, 最高价, 最低价]
                const kline = [item.open, item.close, item.high, item.low];
                klineData.push(kline);
            });
            
            // 更新图表标题
            document.getElementById('chartTitle').textContent = `${symbol} - ${period}分钟K线图`;
            document.getElementById('infoSymbol').textContent = symbol;
            document.getElementById('infoPeriod').textContent = period;
            document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
            
            // 更新K线图表配置
            const option = chart.getOption();
            option.xAxis[0].data = categoryData;
            option.series[0].data = klineData;
            chart.setOption(option);
            
            // 计算并更新附图指标
            const indicator = calculateIndicator(data);
            currentIndicatorData = indicator; // 保存指标数据
            updateIndicatorChart(categoryData, indicator);
        }

        // 更新附图指标图表
        function updateIndicatorChart(categoryData, indicator) {
            const option = indicatorChart.getOption();
            option.xAxis[0].data = categoryData;
            
            // STICKLINE(VAR9>-120, 0, -VAR9, 6, 0), COLORGREEN;
            // 只有当VAR9 > -120时才显示柱状图，否则不显示（用null表示）
            option.series[0].data = indicator.VAR9.map(v => {
                if (v > -120) {
                    return -v; // VAR9取负值显示在下方
                }
                return null; // 不满足条件时不显示
            });
            
            // STICKLINE(VAR9L>-120, 0, VAR9L, 6, 1), COLORRED;
            // 只有当VAR9L > -120时才显示柱状图，否则不显示
            option.series[1].data = indicator.VAR9L.map(v => {
                if (v > -120) {
                    return v;
                }
                return null; // 不满足条件时不显示
            });
            
            indicatorChart.setOption(option);
        }

        function showMessage(text, type) {

        // 运行回测
        function runBacktest() {
            const backtestBtn = document.getElementById('backtestBtn');
            
            // 检查是否有数据
            if (!currentKlineData || !currentIndicatorData) {
                showMessage('请先加载K线数据！', 'error');
                return;
            }
            
            // 检查是否为5分钟线
            const period = document.getElementById('period').value;
            if (period !== '5') {
                showMessage('回测仅支持5分钟K线，请切换周期后再试！', 'error');
                return;
            }
            
            // 禁用按钮
            backtestBtn.disabled = true;
            backtestBtn.textContent = '⏳ 回测中...';
            
            // 使用setTimeout让UI有机会更新
            setTimeout(() => {
                try {
                    const result = executeBacktest();
                    updateBacktestResult(result);
                    showMessage('回测完成！', 'success');
                } catch (error) {
                    console.error('回测执行出错:', error);
                    showMessage('回测执行出错：' + error.message, 'error');
                } finally {
                    // 恢复按钮状态
                    backtestBtn.disabled = false;
                    backtestBtn.textContent = '🔄 反转信号回测';
                }
            }, 100);
        }

        // 执行回测逻辑
        function executeBacktest() {
            const klineData = currentKlineData;
            const indicator = currentIndicatorData;
            const symbol = currentSymbol;
            
            // 初始资金1万元
            let capital = 10000;
            const initialCapital = 10000;
            
            // 交易统计
            let trades = [];
            let currentPosition = null; // 当前持仓 {type: 'long'|'short', entryPrice, entryTime, stopProfit, stopLoss}
            
            // 获取品种配置
            const config = getInstrumentConfig(symbol);
            const tickSize = config.tickSize;           // 最小跳动
            const multiplier = config.multiplier;       // 合约乘数
            const tickValue = tickSize * multiplier;    // 每跳价值（元）
            
            // 固定交易5手
            const lots = TRADE_LOTS;
            
            // 计算10跳的价值（用于止盈止损）
            const jumpValue = tickSize * 10;
            
            // 用于存储图表标记点
            let markPoints = [];
            
            // 遍历所有K线数据
            for (let i = 0; i < klineData.length; i++) {
                const kline = klineData[i];
                const time = kline.time;
                const open = kline.open;
                const high = kline.high;
                const low = kline.low;
                const close = kline.close;
                
                // 获取当前K线的指标值
                const var9 = indicator.VAR9[i];
                const var9L = indicator.VAR9L[i];
                
                // 如果有持仓，检查是否触发止盈或止损
                if (currentPosition) {
                    let isClosed = false;
                    let exitPrice = 0;
                    let exitReason = '';
                    
                    if (currentPosition.type === 'long') {
                        // 多头持仓
                        // 检查是否触发止损（最低价 <= 止损价）
                        if (low <= currentPosition.stopLoss) {
                            isClosed = true;
                            exitPrice = currentPosition.stopLoss;
                            exitReason = '止损';
                        }
                        // 检查是否触发止盈（最高价 >= 止盈价）
                        else if (high >= currentPosition.stopProfit) {
                            isClosed = true;
                            exitPrice = currentPosition.stopProfit;
                            exitReason = '止盈';
                        }
                    } else if (currentPosition.type === 'short') {
                        // 空头持仓
                        // 检查是否触发止盈（最低价 <= 止盈价）
                        if (low <= currentPosition.stopProfit) {
                            isClosed = true;
                            exitPrice = currentPosition.stopProfit;
                            exitReason = '止盈';
                        }
                        // 检查是否触发止损（最高价 >= 止损价）
                        else if (high >= currentPosition.stopLoss) {
                            isClosed = true;
                            exitPrice = currentPosition.stopLoss;
                            exitReason = '止损';
                        }
                    }
                    
                    // 如果平仓，计算盈亏
                    if (isClosed) {
                        // 盈亏 = 价格变动 / 最小跳动 × 每跳价值 × 手数
                        const priceDiff = currentPosition.type === 'long' 
                            ? (exitPrice - currentPosition.entryPrice)
                            : (currentPosition.entryPrice - exitPrice);
                        
                        const ticks = priceDiff / tickSize;  // 变动跳数
                        const profit = ticks * tickValue * lots;  // 盈亏金额
                        
                        capital += profit;
                        
                        trades.push({
                            entryTime: currentPosition.entryTime,
                            exitTime: time,
                            type: currentPosition.type,
                            entryPrice: currentPosition.entryPrice,
                            exitPrice: exitPrice,
                            reason: exitReason,
                            profit: profit,
                            capital: capital
                        });
                        
                        // 添加平仓标记点
                        if (currentPosition.type === 'long') {
                            // 平多：红色"卖"
                            markPoints.push({
                                name: '卖',
                                coord: [time, exitPrice],
                                value: '卖',
                                itemStyle: {
                                    color: '#ef4444'
                                }
                            });
                        } else {
                            // 平空：绿色"平"
                            markPoints.push({
                                name: '平',
                                coord: [time, exitPrice],
                                value: '平',
                                itemStyle: {
                                    color: '#22c55e'
                                }
                            });
                        }
                        
                        currentPosition = null;
                    }
                }
                
                // 如果没有持仓，检查开仓信号
                if (!currentPosition) {
                    // 多头开仓信号：红柱子且VAR9L > 0.5
                    if (var9L > 0.5 && var9L !== null && !isNaN(var9L)) {
                        // 在收盘价开多
                        currentPosition = {
                            type: 'long',
                            entryPrice: close,
                            entryTime: time,
                            stopProfit: close + jumpValue, // 上方10跳止盈
                            stopLoss: close - jumpValue    // 下方10跳止损
                        };
                        
                        // 添加开仓标记点：红色"买"
                        markPoints.push({
                            name: '买',
                            coord: [time, close],
                            value: '买',
                            itemStyle: {
                                color: '#ef4444'
                            }
                        });
                    }
                    // 空头开仓信号：绿柱子且VAR9 < -0.5
                    else if (var9 < -0.5 && var9 !== null && !isNaN(var9)) {
                        // 在收盘价开空
                        currentPosition = {
                            type: 'short',
                            entryPrice: close,
                            entryTime: time,
                            stopProfit: close - jumpValue, // 下方10跳止盈
                            stopLoss: close + jumpValue    // 上方10跳止损
                        };
                        
                        // 添加开仓标记点：绿色"卖"
                        markPoints.push({
                            name: '卖',
                            coord: [time, close],
                            value: '卖',
                            itemStyle: {
                                color: '#22c55e'
                            }
                        });
                    }
                }
            }
            
            // 如果最后还有持仓，按最后一根K线收盘价强制平仓
            if (currentPosition) {
                const lastKline = klineData[klineData.length - 1];
                const exitPrice = lastKline.close;
                
                // 盈亏 = 价格变动 / 最小跳动 × 每跳价值 × 手数
                const priceDiff = currentPosition.type === 'long'
                    ? (exitPrice - currentPosition.entryPrice)
                    : (currentPosition.entryPrice - exitPrice);
                
                const ticks = priceDiff / tickSize;  // 变动跳数
                const profit = ticks * tickValue * lots;  // 盈亏金额
                
                capital += profit;
                
                trades.push({
                    entryTime: currentPosition.entryTime,
                    exitTime: lastKline.time,
                    type: currentPosition.type,
                    entryPrice: currentPosition.entryPrice,
                    exitPrice: exitPrice,
                    reason: '强制平仓',
                    profit: profit,
                    capital: capital
                });
                
                // 添加强制平仓标记点
                if (currentPosition.type === 'long') {
                    // 平多：红色"卖"
                    markPoints.push({
                        name: '卖',
                        coord: [lastKline.time, exitPrice],
                        value: '卖',
                        itemStyle: {
                            color: '#ef4444'
                        }
                    });
                } else {
                    // 平空：绿色"平"
                    markPoints.push({
                        name: '平',
                        coord: [lastKline.time, exitPrice],
                        value: '平',
                        itemStyle: {
                            color: '#22c55e'
                        }
                    });
                }
            }
            
            // 计算统计结果
            const openCount = trades.length;
            const winTrades = trades.filter(t => t.profit > 0);
            const lossTrades = trades.filter(t => t.profit < 0);
            const winCount = winTrades.length;
            const lossCount = lossTrades.length;
            const winRate = openCount > 0 ? (winCount / openCount * 100) : 0;
            const totalProfit = capital - initialCapital;
            
            // 计算跨越时间
            const startTime = klineData[0].time;
            const endTime = klineData[klineData.length - 1].time;
            const timeSpan = `${startTime.split(' ')[0]} ~ ${endTime.split(' ')[0]}`;
            
            // 在K线图上添加标记点
            updateKlineMarkPoints(markPoints);
            
            return {
                openCount: openCount,
                winCount: winCount,
                lossCount: lossCount,
                winRate: winRate,
                totalProfit: totalProfit,
                timeSpan: timeSpan,
                trades: trades
            };
        }

        // 更新K线图标记点
        function updateKlineMarkPoints(markPoints) {
            console.log('标记点数量:', markPoints.length);
            console.log('标记点数据:', markPoints);
            
            if (markPoints.length === 0) {
                showMessage('本次回测没有产生任何交易信号', 'error');
                return;

            const option = chart.getOption();
            
            // 为K线系列添加markPoint
            option.series[0].markPoint = {

            };
            
            chart.setOption(option);

        }

        // 更新回测结果
        function updateBacktestResult(result) {
            const backtestResult = document.getElementById('backtestResult');
            
            // 显示结果面板
            backtestResult.style.display = 'block';
            
            // 更新各项数据
            document.getElementById('openCount').textContent = result.openCount;
            document.getElementById('openCount').className = 'result-value neutral';
            
            const winRateValue = result.winRate;
            document.getElementById('winRate').textContent = winRateValue.toFixed(2) + '%';
            if (winRateValue >= 50) {
                document.getElementById('winRate').className = 'result-value positive';
            } else {
                document.getElementById('winRate').className = 'result-value negative';
            }
            
            const profitValue = result.totalProfit;
            document.getElementById('totalProfit').textContent = profitValue > 0 ? '+' + profitValue.toFixed(2) : profitValue.toFixed(2);
            if (profitValue > 0) {
                document.getElementById('totalProfit').className = 'result-value positive';
            } else if (profitValue < 0) {
                document.getElementById('totalProfit').className = 'result-value negative';
            } else {
                document.getElementById('totalProfit').className = 'result-value neutral';
            }
            
            document.getElementById('timeSpan').textContent = result.timeSpan;
            document.getElementById('timeSpan').className = 'result-value neutral';
            
            // 添加买卖记录列表
            updateTradeRecords(result.trades);
        }

        // 更新买卖记录列表
        function updateTradeRecords(trades) {
            // 创建或获取交易记录面板
            let tradeRecordsPanel = document.getElementById('tradeRecordsPanel');
            if (!tradeRecordsPanel) {
                tradeRecordsPanel = document.createElement('div');
                tradeRecordsPanel.id = 'tradeRecordsPanel';
                tradeRecordsPanel.className = 'backtest-result';
                tradeRecordsPanel.style.marginTop = '15px';
                tradeRecordsPanel.style.maxHeight = '400px';
                tradeRecordsPanel.style.overflowY = 'auto';
                document.querySelector('.sidebar').appendChild(tradeRecordsPanel);
            }
            
            if (trades.length === 0) {
                tradeRecordsPanel.innerHTML = '<h4>📝 交易记录</h4><p style="color: #888; text-align: center; padding: 20px;">暂无交易记录</p>';
                tradeRecordsPanel.style.display = 'block';
                return;
            }
            
            let html = '<h4>📝 交易记录</h4>';
            html += '<div style="margin-top: 10px;">';
            
            trades.forEach((trade, index) => {
                const typeLabel = trade.type === 'long' ? '多头' : '空头';
                const typeColor = trade.type === 'long' ? '#ef4444' : '#22c55e';
                const profitColor = trade.profit > 0 ? '#ef4444' : trade.profit < 0 ? '#22c55e' : '#fff';
                const profitText = trade.profit > 0 ? `+${trade.profit.toFixed(2)}` : trade.profit.toFixed(2);
                
                html += `
                    <div style="background: #16213e; padding: 10px; margin-bottom: 8px; border-radius: 5px; border-left: 3px solid ${typeColor};">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <span style="color: ${typeColor}; font-weight: bold;">#${index + 1} ${typeLabel}</span>
                            <span style="color: ${profitColor}; font-weight: bold;">${profitText}元</span>
                        </div>
                        <div style="font-size: 11px; color: #888; line-height: 1.6;">
                            <div>开仓: ${trade.entryTime}</div>
                            <div>平仓: ${trade.exitTime}</div>
                            <div>买点: ${trade.entryPrice.toFixed(2)} → 卖点: ${trade.exitPrice.toFixed(2)}</div>
                            <div>原因: ${trade.reason}</div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            tradeRecordsPanel.innerHTML = html;
            tradeRecordsPanel.style.display = 'block';
        }

                        loading.style.display = 'none';
                    }, 300);
                });
            }, 100);
        });
    </script>
</body>
