<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化回测 - 期货量化交易系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }

        .header h1 {
            font-size: 24px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .username {
            color: #00d4ff;
            font-size: 14px;
        }

        .logout-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .sidebar {
            width: 300px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #0f3460;
        }

        .control-panel {
            background: #0f3460;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .control-panel h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 13px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            background: #16213e;
            border: 1px solid #233554;
            border-radius: 5px;
            color: #eee;
            font-size: 14px;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .chart-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #1a1a2e;
            min-height: 0; /* 确保flex子元素能正确收缩 */
        }

        .chart-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-shrink: 0; /* 标题不被压缩 */
        }

        .chart-title h2 {
            color: #00d4ff;
            font-size: 20px;
        }

        .data-info {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .info-item {
            display: flex;
            gap: 5px;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #00d4ff;
            font-weight: bold;
        }

        #klineChart {
            flex: 3; /* 主K线图占据3份空间 */
            background: #16213e;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            min-height: 300px; /* 最小高度保证 */
        }

        #indicatorChart {
            flex: 1; /* 副指标图表占据1份空间 */
            background: #16213e;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
            min-height: 150px; /* 最小高度保证 */
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .loading.hide {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            color: #00d4ff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 5px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message.success {
            background: #22c55e;
            color: white;
        }

        .message.error {
            background: #ef4444;
            color: white;
        }

        /* .stats-panel styles removed */

        .backtest-result {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }

        .backtest-result h4 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-item {
            background: #16213e;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
        }

        .result-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .result-value {
            color: #00d4ff;
            font-size: 18px;
            font-weight: bold;
        }

        .result-value.positive {
            color: #ef4444;
        }

        .result-value.negative {
            color: #22c55e;
        }

        .result-value.neutral {
            color: #ffffff;
        }

        .backtest-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .backtest-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .backtest-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 量化回测系统</h1>
        <div class="user-info">
            <span class="username">欢迎, {{ username }}</span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="control-panel">
                <h3>⚙️ 回测参数设置</h3>
                <div class="form-group">
                    <label>合约代码</label>
                    <select id="symbol">
                        <option value="FU2611">燃料油FU2611</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>数据周期</label>
                    <select id="period">
                        <option value="1">1分钟</option>
                        <option value="5">5分钟</option>
                        <option value="15">15分钟</option>
                        <option value="30">30分钟</option>
                        <option value="60">60分钟</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>数据范围</label>
                    <select id="dateRange">
                        <option value="7">近7天</option>
                        <option value="30" selected>近30天</option>
                        <option value="60">近60天</option>
                        <option value="90">近90天</option>
                    </select>
                </div>
                <button class="btn" id="loadBtn" onclick="loadKlineData()">
                    📈 加载数据
                </button>
            </div>

            <button class="backtest-btn" id="backtestBtn" onclick="runBacktest()">
                🔄 反转信号回测
            </button>

            <div class="backtest-result" id="backtestResult">
                <h4>📊 回测结果</h4>
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">开仓次数</div>
                        <div class="result-value neutral" id="openCount">0</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">胜率</div>
                        <div class="result-value neutral" id="winRate">0%</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">总盈亏</div>
                        <div class="result-value neutral" id="totalProfit">0</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">跨越时间</div>
                        <div class="result-value neutral" id="timeSpan">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">
                <h2 id="chartTitle">燃料油FU2611 - 1分钟K线图</h2>
                <div class="data-info">
                    <div class="info-item">
                        <span class="info-label">合约:</span>
                        <span class="info-value" id="infoSymbol">FU2611</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">周期:</span>
                        <span class="info-value" id="infoPeriod">1分钟</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">更新时间:</span>
                        <span class="info-value" id="updateTime">--</span>
                    </div>
                </div>
            </div>
            <div id="klineChart"></div>
            <div id="indicatorChart"></div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">正在加载数据...</div>
    </div>

    <script>
        let chart = null;
        let indicatorChart = null; // 附图指标图表

        // 初始化图表
        function initChart() {
            const chartDom = document.getElementById('klineChart');
            chart = echarts.init(chartDom);
            
            const option = {
                backgroundColor: '#16213e',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    },
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: '#00d4ff',
                    textStyle: {
                        color: '#fff'
                    },
                    formatter: function (params) {
                        const data = params[0];
                        if (!data) return '';
                        
                        const values = data.data;
                        // ECharts candlestick 数据格式: [开盘价, 收盘价, 最低价, 最高价]
                        // values[0]=开盘价, values[1]=收盘价, values[2]=最低价, values[3]=最高价
                        return `
                            <div style="font-weight: bold; margin-bottom: 5px;">${data.axisValue}</div>
                            <div>开盘: ${values[0]}</div>
                            <div>收盘: ${values[1]}</div>
                            <div>最低: ${values[2]}</div>
                            <div>最高: ${values[3]}</div>
                        `;
                    }
                },
                grid: {
                    left: '10%',
                    right: '5%',
                    top: '5%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: [],
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        show: false // 隐藏X轴标签
                    },
                    axisTick: {
                        show: false // 隐藏刻度线
                    }
                },
                yAxis: {
                    type: 'value',
                    scale: true,
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        color: '#aaa'
                    },
                    splitLine: {
                        lineStyle: {
                            color: '#2a2a3e'
                        }
                    }
                },
                dataZoom: [
                    {
                        type: 'inside',
                        xAxisIndex: [0],
                        start: 70,
                        end: 100
                    },
                    {
                        show: true,
                        xAxisIndex: [0],
                        type: 'slider',
                        bottom: '5%',
                        height: 20,
                        start: 70,
                        end: 100,
                        borderColor: '#00d4ff',
                        backgroundColor: '#0f3460',
                        dataBackground: {
                            lineStyle: {
                                color: '#00d4ff'
                            },
                            areaStyle: {
                                color: 'rgba(0, 212, 255, 0.2)'
                            }
                        }
                    }
                ],
                series: [
                    {
                        name: 'K线',
                        type: 'candlestick',
                        data: [],
                        itemStyle: {
                            color: '#ef4444',        // 阳线颜色（红色）
                            color0: '#22c55e',       // 阴线颜色（绿色）
                            borderColor: '#ef4444',  // 阳线边框
                            borderColor0: '#22c55e'  // 阴线边框
                        }
                    }
                ]
            };
            
            chart.setOption(option);
            
            // 初始化附图指标图表
            initIndicatorChart();
            
            // 实现主副图表dataZoom联动
            chart.on('dataZoom', function(params) {
                const option = chart.getOption();
                const start = option.dataZoom[0].start;
                const end = option.dataZoom[0].end;
                
                // 同步副指标图表的缩放
                const indicatorOption = indicatorChart.getOption();
                indicatorOption.dataZoom[0].start = start;
                indicatorOption.dataZoom[0].end = end;
                if (indicatorOption.dataZoom[1]) {
                    indicatorOption.dataZoom[1].start = start;
                    indicatorOption.dataZoom[1].end = end;
                }
                indicatorChart.setOption(indicatorOption);
            });
            
            indicatorChart.on('dataZoom', function(params) {
                const option = indicatorChart.getOption();
                const start = option.dataZoom[0].start;
                const end = option.dataZoom[0].end;
                
                // 同步主K线图表的缩放
                const mainOption = chart.getOption();
                mainOption.dataZoom[0].start = start;
                mainOption.dataZoom[0].end = end;
                chart.setOption(mainOption);
            });
            
            // 响应图表
            window.addEventListener('resize', function() {
                chart.resize();
                indicatorChart.resize();
            });
        }

        // 初始化附图指标图表
        function initIndicatorChart() {
            const indicatorDom = document.getElementById('indicatorChart');
            indicatorChart = echarts.init(indicatorDom);
            
            const option = {
                backgroundColor: '#16213e',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: '#00d4ff',
                    textStyle: {
                        color: '#fff'
                    }
                },
                grid: {
                    left: '10%',
                    right: '5%',
                    top: '10%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: [],
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        show: false // 隐藏X轴标签
                    },
                    axisTick: {
                        show: false // 隐藏刻度线
                    }
                },
                yAxis: {
                    type: 'value',
                    scale: true,
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        color: '#aaa'
                    },
                    splitLine: {
                        lineStyle: {
                            color: '#2a2a3e'
                        }
                    }
                },
                dataZoom: [
                    {
                        type: 'inside',
                        xAxisIndex: [0],
                        start: 70,
                        end: 100
                    }
                ],
                series: [
                    {
                        name: 'VAR9',
                        type: 'bar',
                        data: [],
                        itemStyle: {
                            color: '#22c55e' // 绿色
                        }
                    },
                    {
                        name: 'VAR9L',
                        type: 'bar',
                        data: [],
                        itemStyle: {
                            color: '#ef4444' // 红色
                        }
                    }
                ]
            };
            
            indicatorChart.setOption(option);
        }

        // 加载K线数据
        async function loadKlineData() {
            const symbol = document.getElementById('symbol').value;
            const period = document.getElementById('period').value;
            const dateRange = document.getElementById('dateRange').value;
            
            const loadBtn = document.getElementById('loadBtn');
            const loading = document.getElementById('loading');
            
            loadBtn.disabled = true;
            // 显示遮罩层
            loading.style.display = 'flex';
            loading.classList.remove('hide');
            
            try {
                const url = `/api/backtest/kline?symbol=${symbol}&period=${period}&days=${dateRange}`;
                console.log('请求URL:', url);
                
                const response = await fetch(url);
                
                // 检查HTTP状态码
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('HTTP错误:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const result = await response.json();
                console.log('API响应:', result);
                
                if (result.success && result.data) {
                    updateChart(result.data, symbol, period);
                    showMessage(`数据加载成功！共 ${result.count || result.data.length} 条数据`, 'success');
                } else {
                    showMessage(result.message || '数据加载失败', 'error');
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                const errorMsg = error.message || '网络请求失败';
                showMessage(`加载失败: ${errorMsg}`, 'error');
            } finally {
                loadBtn.disabled = false;
                // 隐藏遮罩层
                loading.classList.add('hide');
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 300);
            }
        }

        // 同花顺指标计算辅助函数
        // SMA函数：简单移动平均
        function SMA(data, period, weight) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(0);
                } else {
                    let sum = 0;
                    for (let j = 0; j < period; j++) {
                        sum += data[i - j] * (weight || 1);
                    }
                    result.push(sum / period);
                }
            }
            return result;
        }

        // EMA函数：指数移动平均
        function EMA(data, period) {
            const result = [];
            const multiplier = 2 / (period + 1);
            
            for (let i = 0; i < data.length; i++) {
                if (i === 0) {
                    result.push(data[0]);
                } else {
                    result.push((data[i] - result[i - 1]) * multiplier + result[i - 1]);
                }
            }
            return result;
        }

        // REF函数：引用前N个数据
        function REF(data, n) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < n) {
                    result.push(data[i]);
                } else {
                    result.push(data[i - n]);
                }
            }
            return result;
        }

        // HHV函数：取N个周期内的最高值
        function HHV(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(data[i]);
                } else {
                    let max = data[i];
                    for (let j = 1; j < period; j++) {
                        max = Math.max(max, data[i - j]);
                    }
                    result.push(max);
                }
            }
            return result;
        }

        // LLV函数：取N个周期内的最低值
        function LLV(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(data[i]);
                } else {
                    let min = data[i];
                    for (let j = 1; j < period; j++) {
                        min = Math.min(min, data[i - j]);
                    }
                    result.push(min);
                }
            }
            return result;
        }

        // ABS函数：取绝对值
        function ABS(data) {
            return data.map(v => Math.abs(v));
        }

        // MAX函数：取两个数组的最大值
        function MAX(data1, data2) {
            return data1.map((v, i) => Math.max(v, data2[i] || 0));
        }

        // IF函数：条件判断
        function IF(condition, trueValue, falseValue) {
            return condition.map((c, i) => c ? trueValue[i] : falseValue[i]);
        }

        // 计算同花顺指标
        function calculateIndicator(data) {
            const high = data.map(d => d.high);
            const low = data.map(d => d.low);
            const close = data.map(d => d.close);
            
            // 计算 VAR2 到 VAR9
            const VAR2 = REF(high, 1);
            const VAR3_temp1 = SMA(ABS(high.map((h, i) => h - VAR2[i])), 3, 1);
            const VAR3_temp2 = SMA(MAX(VAR2.map((v, i) => v - high[i]), 0), 3, 1);
            const VAR3 = VAR3_temp1.map((v, i) => VAR3_temp2[i] !== 0 ? (v / VAR3_temp2[i]) * 100 : 0);
            
            const VAR4_base = close.map((c, i) => c > 0.7 ? VAR3[i] * 10 : VAR3[i] / 10);
            const VAR4 = EMA(VAR4_base, 3);
            
            const VAR5 = HHV(high, 50);
            const VAR6 = LLV(VAR4, 50);
            const VAR7 = close.map(c => 1); // MA(CLOSE,58) > 0 的条件，简化为1
            
            const VAR8_base = high.map((h, i) => {
                if (h >= VAR5[i]) {
                    return (VAR4[i] + VAR6[i] * 2) / 2;
                }
                return 0;
            });
            const VAR8 = EMA(VAR8_base, 3).map((v, i) => v / 1000 * VAR7[i]);
            const VAR9 = VAR8.map(v => v > 100 ? 100 : v);
            
            // 计算 VAR2L 到 VAR9L
            const VAR2L = REF(low, 1);
            const VAR3L_temp1 = SMA(ABS(low.map((l, i) => l - VAR2L[i])), 3, 1);
            const VAR3L_temp2 = SMA(MAX(low.map((l, i) => l - VAR2L[i]), 0), 3, 1);
            const VAR3L = VAR3L_temp1.map((v, i) => VAR3L_temp2[i] !== 0 ? (v / VAR3L_temp2[i]) * 100 : 0);
            
            const VAR4L_base = close.map((c, i) => c > 1.3 ? VAR3L[i] * 10 : VAR3L[i] / 10);
            const VAR4L = EMA(VAR4L_base, 3);
            
            const VAR5L = LLV(low, 50);
            const VAR6L = HHV(VAR4L, 50);
            const VAR7L = close.map(c => 1); // MA(CLOSE,58) > 0 的条件，简化为1
            
            const VAR8L_base = low.map((l, i) => {
                if (l <= VAR5L[i]) {
                    return (VAR4L[i] + VAR6L[i] * 2) / 2;
                }
                return 0;
            });
            const VAR8L = EMA(VAR8L_base, 3).map((v, i) => v / 1000 * VAR7L[i]);
            const VAR9L = VAR8L.map(v => v > 100 ? 100 : v);
            
            return {
                VAR9: VAR9,
                VAR9L: VAR9L
            };
        }

        // 更新图表
        function updateChart(data, symbol, period) {
            // 准备K线数据
            const categoryData = []; // 时间轴
            const klineData = [];    // K线数据 [开盘, 收盘, 最低, 最高]
            
            data.forEach(item => {
                categoryData.push(item.time);
                // ECharts candlestick 数据格式: [开盘价, 收盘价, 最低价, 最高价]
                klineData.push([item.open, item.close, item.low, item.high]);
            });
            
            // 更新图表标题
            document.getElementById('chartTitle').textContent = `${symbol} - ${period}分钟K线图`;
            document.getElementById('infoSymbol').textContent = symbol;
            document.getElementById('infoPeriod').textContent = period;
            document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
            
            // 更新K线图表配置
            const option = chart.getOption();
            option.xAxis[0].data = categoryData;
            option.series[0].data = klineData;
            chart.setOption(option);
            
            // 计算并更新附图指标
            const indicator = calculateIndicator(data);
            updateIndicatorChart(categoryData, indicator);
        }

        // 更新附图指标图表
        function updateIndicatorChart(categoryData, indicator) {
            const option = indicatorChart.getOption();
            option.xAxis[0].data = categoryData;
            option.series[0].data = indicator.VAR9.map(v => -v); // VAR9取负值显示在下方
            option.series[1].data = indicator.VAR9L;
            indicatorChart.setOption(option);
        }

        // 显示消息
        function showMessage(text, type) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }

        // 运行回测
        function runBacktest() {
            const backtestBtn = document.getElementById('backtestBtn');
            const backtestResult = document.getElementById('backtestResult');
            
            // 禁用按钮
            backtestBtn.disabled = true;
            backtestBtn.textContent = '⏳ 回测中...';
            
            // 模拟回测过程（实际策略待实现）
            setTimeout(() => {
                // 模拟回测结果数据
                const mockResult = {
                    openCount: 15,           // 开仓次数
                    winCount: 9,             // 盈利次数
                    lossCount: 6,            // 亏损次数
                    winRate: 60.0,           // 胜率
                    totalProfit: 12500,      // 总盈亏
                    timeSpan: '2024-09-01 ~ 2024-10-01'  // 跨越时间
                };
                
                // 更新回测结果
                updateBacktestResult(mockResult);
                
                // 恢复按钮状态
                backtestBtn.disabled = false;
                backtestBtn.textContent = '🔄 反转信号回测';
                
                showMessage('回测完成！', 'success');
            }, 1500);
        }

        // 更新回测结果
        function updateBacktestResult(result) {
            const backtestResult = document.getElementById('backtestResult');
            
            // 显示结果面板
            backtestResult.style.display = 'block';
            
            // 更新各项数据
            document.getElementById('openCount').textContent = result.openCount;
            document.getElementById('openCount').className = 'result-value neutral';
            
            const winRateValue = result.winRate;
            document.getElementById('winRate').textContent = winRateValue.toFixed(2) + '%';
            if (winRateValue >= 50) {
                document.getElementById('winRate').className = 'result-value positive';
            } else {
                document.getElementById('winRate').className = 'result-value negative';
            }
            
            const profitValue = result.totalProfit;
            document.getElementById('totalProfit').textContent = profitValue > 0 ? '+' + profitValue : profitValue;
            if (profitValue > 0) {
                document.getElementById('totalProfit').className = 'result-value positive';
            } else if (profitValue < 0) {
                document.getElementById('totalProfit').className = 'result-value negative';
            } else {
                document.getElementById('totalProfit').className = 'result-value neutral';
            }
            
            document.getElementById('timeSpan').textContent = result.timeSpan;
            document.getElementById('timeSpan').className = 'result-value neutral';
        }

        // 退出登录
        async function logout() {
            try {
                const response = await fetch('/logout', { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('退出失败:', error);
            }
        }

        // 页面加载完成后初始化图表
        window.addEventListener('load', function() {
            const loading = document.getElementById('loading');
            
            // 确保遮罩层显示
            loading.style.display = 'flex';
            loading.classList.remove('hide');
            
            // 延迟初始化图表，确保页面能正常渲染
            setTimeout(() => {
                initChart();
                // 自动加载一次数据
                loadKlineData().then(() => {
                    // 数据加载完成后，立即隐藏遮罩层
                    loading.classList.add('hide');
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 300);
                });
            }, 100);
        });
    </script>
